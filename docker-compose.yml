# Optional convenience for local development. If you already have MySQL
# installed (or use a managed/cloud database), you don't need this — just
# point DATABASE_URL at it instead.
#
# Usage: docker compose up -d
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: vip_mobiles
    ports:
      - "3306:3306"
    volumes:
      - vip_mobiles_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  vip_mobiles_mysql_data:
